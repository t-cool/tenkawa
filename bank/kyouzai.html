<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材バンク - ふるさと学習</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-6">

    <!-- 操作ナビゲーションバー -->
    <header class="no-print max-w-[900px] mx-auto mb-6 bg-white p-3.5 md:p-4 rounded-xl border border-slate-300 shadow-xs flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded text-sm transition flex items-center gap-2 border border-slate-300">
                <i class="fa-solid fa-arrow-left text-xs text-slate-500"></i>
                <i class="fa-solid fa-house text-slate-600"></i>
                <span>目次</span>
            </a>
            <span class="text-slate-300">|</span>
            <div class="text-xs md:text-sm font-bold text-slate-700">
                ふるさと学習 教材バンク
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="jinzai.html" class="px-3 py-1.5 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 font-medium rounded text-sm transition flex items-center gap-1.5 border border-slate-300">
                <i class="fa-solid fa-address-book text-xs text-emerald-600"></i>
                <span>人材バンクへ</span>
            </a>
            <a href="../keiji/keiji.html" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-700 font-medium rounded text-sm transition flex items-center gap-1.5 border border-slate-300">
                <i class="fa-solid fa-chalkboard-user text-xs text-blue-600"></i>
                <span>校内掲示へ</span>
            </a>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-[900px] mx-auto space-y-6">

        <!-- ページ見出しカード -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between flex-wrap gap-2">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-0.5 rounded">
                            川部会
                        </span>
                        <span class="text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded">
                            学習リソースの蓄積・共有
                        </span>
                    </div>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 mt-2">
                        教材バンク
                    </h1>
                </div>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">
                ふるさと学習（総合的な学習の時間）を推進・充実させるため、過去の学習指導案、ワークシート、地域素材の写真・映像データ、成果物などを蓄積・共有するページです。
            </p>
        </section>

        <!-- 教材バンク（過去のふるさと学習資料） -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
                <h2 class="text-base md:text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-box-archive text-blue-600"></i>
                    <span>過去の学習資料・実践記録</span>
                </h2>
                <span class="text-xs text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded-full font-medium">資料の蓄積・共有</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-600 mb-4 leading-relaxed">
                これまでに実践されたふるさと学習に関わる指導案、ワークシート、地域素材の写真・映像データ、児童生徒の成果物や発表資料などをまとめています。
            </p>

            <div class="p-5 rounded-xl border border-dashed border-slate-300 bg-slate-50/60 text-slate-500 text-xs sm:text-sm leading-relaxed">
                <div class="flex items-center gap-2 font-bold text-slate-700 mb-1">
                    <i class="fa-solid fa-folder-open text-amber-500"></i>
                    <span>登録資料一覧（準備中）</span>
                </div>
                過去の学年別実践資料、ワークシートテンプレート、地域マップ等のデータを順次追加・整理していきます。
            </div>
        </section>

    </main>

</body>
</html>
