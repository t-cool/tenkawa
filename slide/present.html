<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究発表スライド - ふるさと学習</title>
    <link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-6">

    <!-- 操作ナビゲーションバー -->
    <header class="no-print max-w-[900px] mx-auto mb-6 bg-white p-3.5 md:p-4 rounded-xl border border-slate-300 shadow-xs flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded text-sm transition flex items-center gap-2 border border-slate-300">
                <i class="fa-solid fa-arrow-left text-xs text-slate-500"></i>
                <i class="fa-solid fa-house text-slate-600"></i>
                <span>目次</span>
            </a>
            <span class="text-slate-300">|</span>
            <div class="text-xs md:text-sm font-bold text-slate-700">
                ふるさと学習 発表資料
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-[900px] mx-auto space-y-6">

        <!-- メモ（Google ドキュメント） -->
        <section class="no-print bg-white p-4 sm:p-5 rounded-xl border border-blue-200 bg-gradient-to-r from-blue-50/60 to-white shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="space-y-0.5">
                    <div class="flex items-center gap-2 text-slate-900 font-bold text-sm sm:text-base">
                        <i class="fa-solid fa-file-lines text-blue-600 text-base sm:text-lg"></i>
                        <span>メモ（Google ドキュメント）</span>
                    </div>
                    <p class="text-xs text-slate-500">
                        「研究発表スライド」に関する検討メモや共有事項(担当者用)
                    </p>
                </div>
                <a href="https://docs.google.com/document/d/1fjTWP2-Gq8ZHUR5F2ngNxVHHOzkulkPttsxztkxca9o" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-4 py-2 sm:px-5 sm:py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-xs transition shrink-0 group">
                    <span>ドキュメントを開く</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs transition-transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
                </a>
            </div>
        </section>

        <!-- ページ見出しカード -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between flex-wrap gap-2">
                <div>
                    <span class="text-xs font-bold text-rose-700 bg-rose-50 border border-rose-200 px-2.5 py-0.5 rounded">
                        発表会用資料
                    </span>
                    <h1 class="text-xl md:text-2xl font-bold text-slate-900 mt-1.5">
                        研究発表スライド
                    </h1>
                </div>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">
                大会当日、研究主任が発表するプレゼンテーションスライドを掲載します。
            </p>
        </section>

        <!-- スライド資料プレースホルダー -->
        <section class="bg-white p-6 md:p-8 rounded-xl border border-slate-300 shadow-xs">
            <h2 class="text-base md:text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-display text-rose-500"></i>
                <span>発表スライド・提示資料</span>
            </h2>

            <div class="p-8 text-center border-2 border-dashed border-slate-200 rounded-xl bg-slate-50/50">
                <i class="fa-solid fa-file-powerpoint text-slate-300 text-4xl mb-3"></i>
                <div class="font-medium text-slate-600 text-sm mb-1">
                    スライド資料 準備中
                </div>
                <p class="text-xs text-slate-400">
                    発表会で使用するスライド資料や解説データを今後整理・掲載していく予定です。
                </p>
            </div>
        </section>

    </main>

</body>
</html>
