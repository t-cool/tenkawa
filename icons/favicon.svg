<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#021c14" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <!-- Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" />
  <circle cx="256" cy="256" r="182" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
  <!-- '天' Character -->
  <text x="256" y="260" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif" font-weight="700" font-size="266" text-anchor="middle" dominant-baseline="central" fill="#ffffff" filter="url(#shadow)">天</text>
</svg>
